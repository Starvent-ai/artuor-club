name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npm run test:core

      - run: npm run test:database

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npm run build --workspace=packages/desktop-app

      - run: npx electron-builder --win --publish never
        working-directory: packages/desktop-app

      - uses: actions/upload-artifact@v4
        with:
          name: arthurclub-windows-installer
          path: packages/desktop-app/release/*.exe

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop-app/release/*.exe
